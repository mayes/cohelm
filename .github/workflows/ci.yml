name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    name: Helper tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Mac and Windows check the private pipe on each platform with Chrome
        # for Testing; the release builds still run on the project's own
        # machines.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Chrome for Testing: branded Chrome dropped --load-extension, which
      # Cohelm uses for its built-in extension, and on the Mac runner the
      # branded build can't start its own child processes.
      - id: chrome
        shell: bash
        run: |
          out=$(npx -y @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/cft")
          echo "$out"
          line=$(printf '%s\n' "$out" | tail -n 1)
          # "chrome@<version> <path>"; the path has spaces in it.
          echo "path=${line#* }" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          COHELM_TEST_CHROME: ${{ steps.chrome.outputs.path }}
          # Linux runners block Chromium's sandbox.
          COHELM_TEST_CHROME_ARGS: ${{ runner.os == 'Linux' && '--no-sandbox' || '' }}
          COHELM_REQUIRE_BROWSER_TESTS: "1"

  packaging:
    # Packages Chrome for Testing as a stand-in for the Cohelm browser build,
    # installs it as a person would, and runs the installed-app smoke test.
    # Nothing is uploaded or published.
    name: Packaging check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: chrome
        shell: bash
        run: |
          out=$(npx -y @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/cft")
          line=$(printf '%s\n' "$out" | tail -n 1)
          echo "path=${line#* }" >> "$GITHUB_OUTPUT"
      - run: cargo build --locked --release
        working-directory: helper
      - name: Package and open the Mac app
        if: runner.os == 'macOS'
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          app=$(dirname "$(dirname "$(dirname "$CHROME")")")
          browser/packaging/package-macos.sh "$app" helper/target/release/cohelm-helper 0.0.0 "$RUNNER_TEMP/out"
          echo "COHELM_PACKAGED_HELPER=$RUNNER_TEMP/out/Cohelm.app/Contents/MacOS/Cohelm" >> "$GITHUB_ENV"
      - name: Package and install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $setup = & browser/packaging/package-windows.ps1 -Browser (Split-Path $env:CHROME) -Helper helper/target/release/cohelm-helper.exe -Version 0.0.0 -Out "$env:RUNNER_TEMP\out" | Select-Object -Last 1
          Start-Process -Wait -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          "COHELM_PACKAGED_HELPER=$env:LOCALAPPDATA\Programs\Cohelm\Cohelm.exe" >> $env:GITHUB_ENV
      - run: cargo test --locked --release --test packaged
        working-directory: helper

  browser-scripts:
    name: Browser build scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x browser/scripts/*.sh browser/tests/*.sh browser/packaging/*.sh
      - run: browser/tests/apply-cohelm.test.sh
