name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  helper:
    name: Helper tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Mac and Windows check the private pipe on each platform's own
        # Chrome; the release builds still run on the project's own machines.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          COHELM_TEST_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          # Linux runners block Chromium's sandbox.
          COHELM_TEST_CHROME_ARGS: ${{ runner.os == 'Linux' && '--no-sandbox' || '' }}
          COHELM_REQUIRE_BROWSER_TESTS: "1"

  browser-scripts:
    name: Browser build scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck browser/scripts/*.sh browser/tests/*.sh
      - run: browser/tests/apply-cohelm.test.sh
