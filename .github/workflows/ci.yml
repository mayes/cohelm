name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  helper:
    name: Helper tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Mac and Windows check the private pipe on each platform's own
        # Chrome; the release builds still run on the project's own machines.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      # Temporary: the Mac runner's setup-chrome build can't start its child
      # processes (MachPortRendezvous "Permission denied"), in port and pipe
      # mode alike. Try Chrome for Testing, the build Puppeteer uses.
      - id: cft
        if: runner.os == 'macOS'
        shell: bash
        run: |
          out=$(npx -y @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/cft")
          echo "$out"
          line=$(printf '%s\n' "$out" | tail -n 1)
          # "chrome@<version> <path>"; the path has spaces in it.
          echo "path=${line#* }" >> "$GITHUB_OUTPUT"
      - name: Mac Chrome launch check (temporary)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        env:
          SETUP_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CFT_CHROME: ${{ steps.cft.outputs.path }}
        run: |
          for name in SETUP_CHROME CFT_CHROME; do
            chrome=${!name}
            dir=$(mktemp -d)
            "$chrome" --headless=new --no-first-run --user-data-dir="$dir" --remote-debugging-pipe about:blank 3</dev/null 4>/dev/null 2>"$dir/err" &
            pid=$!
            sleep 10
            kill "$pid" 2>/dev/null || true
            echo "== $name: rendezvous errors: $(grep -c MachPortRendezvous "$dir/err" || true), crashes: $(grep -c crashed "$dir/err" || true)"
            codesign -dv "$(dirname "$(dirname "$(dirname "$chrome")")")" 2>&1 | grep -E "Identifier|TeamIdentifier|Signature" || true
          done
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          COHELM_TEST_CHROME: ${{ steps.cft.outputs.path || steps.chrome.outputs.chrome-path }}
          # Linux runners block Chromium's sandbox.
          COHELM_TEST_CHROME_ARGS: ${{ runner.os == 'Linux' && '--no-sandbox' || '' }}
          COHELM_REQUIRE_BROWSER_TESTS: "1"

  browser-scripts:
    name: Browser build scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck browser/scripts/*.sh browser/tests/*.sh
      - run: browser/tests/apply-cohelm.test.sh
